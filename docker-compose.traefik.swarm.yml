services:
  traefik-reverse-proxy:
    image: traefik:3.6
    networks:
      - proxy_net
    command:
      # HTTP and HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.forwardedHeaders.insecure=true
      - --entrypoints.web.forwardedHeaders.insecure=true
      # Docker swarm 
      - --providers.swarm.endpoint=unix:///var/run/docker.sock # Or tcp://<host>:<port>
      - --providers.swarm.network=traefik_proxy_net
      - --providers.swarm.exposedbydefault=false
      # Let's Encrypt
      - --certificatesresolvers.le.acme.email=${LE_EMAIL}
      #    Use the following for staging:
      # - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
      #    Use the following for normal access:
      - --certificatesresolvers.le.acme.caserver=https://acme-v02.api.letsencrypt.org/directory      
      - --certificatesresolvers.le.acme.storage=/etc/traefik/acme/acme.json
      - --certificatesresolvers.le.acme.httpChallenge=true
      - --certificatesresolvers.le.acme.httpChallenge.entryPoint=web
      # Dashboard
      #    This allows the dashboard to be shown in the LAN (but not elsewhere)
      - --api.insecure=true
      # Logging Setup
      - --log.level=ERROR
      - --log.filePath=/log/traefik.log
      - --log.format=json
      - --log.compress=true
      #  Allow access logs
      - --accesslog=true
      - --accesslog.filePath=/var/log/ACCESS_LOGS/access.log
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultMode=keep
      # Uncomment to add a place for dynamic files to be stored and read - see 'Volumes', below.
      #- --providers.file=true
      #- --providers.file.directory=/etc/traefik/dynamic/
      #- --providers.file.watch=true


    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.traefik == true
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik_proxy_net"
        - "traefik.http.services.traefik-reverse-proxy.loadbalancer.server.port=8080"

    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
      - target: 8080
        published: 8080
        mode: host
      - target: 9797
        published: 9797
        mode: host
        
    volumes:
      - ./acme/:/etc/traefik/acme/
      - ./logs/:/log/
      - ./ACCESS_LOGS/:/var/log/ACCESS_LOGS/
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # If you want dynamic configs, add a directory something like this.
      #- ./dynamic_configs/:/etc/traefik/dynamic/ # Mount a local directory for dynamic files


  whoami:
    image: traefik/whoami
    networks:
      - proxy_net
    deploy:
      replicas: 3
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=traefik_proxy_net"
        - "traefik.http.routers.whoami.rule=Host(`traefik-whoami.swarm`)"
        - "traefik.http.services.whoami.loadbalancer.server.port=80"
        - "traefik.http.routers.whoami.entrypoints=websecure"
        - "traefik.http.routers.whoami.tls=true"
networks:
  proxy_net:
    name: "traefik_proxy_net"
