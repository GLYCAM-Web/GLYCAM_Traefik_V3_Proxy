services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.15.0-victorialogs
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=100y
      - -httpListenAddr=:9428
    networks:
      - proxy_net
    # Port 9428 is kept internal to proxy_net so VictoriaLogs is never exposed
    # on public interfaces. Access VMUI via SSH tunnel or docker exec if needed.
    volumes:
      - ./logging/data/victorialogs:/victoria-logs-data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.traefik == true

  vector:
    image: timberio/vector:0.42.0-alpine
    entrypoint:
      - /bin/sh
      - /etc/vector/entrypoint.sh
    environment:
      - INTERNAL_IP_CIDRS=${INTERNAL_IP_CIDRS:-}
    networks:
      - proxy_net
    volumes:
      - ./ACCESS_LOGS/:/var/log/ACCESS_LOGS/:ro
      - ./logging/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./logging/vector/entrypoint.sh:/etc/vector/entrypoint.sh:ro
      - ./logging/geoip/:/etc/vector/geoip/:ro
      - ./logging/:/etc/logging-config/:ro
      - ./logging/data/vector:/var/lib/vector
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.traefik == true

  grafana:
    image: grafana/grafana:11.5.2
    user: "0:0"
    entrypoint:
      - /bin/sh
      - /etc/logging-config/grafana/entrypoint.sh
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?ERROR_Set_GRAFANA_ADMIN_PASSWORD_in_config.bash}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_SECURITY_COOKIE_SECURE=${GRAFANA_COOKIE_SECURE:-false}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://${GRAFANA_HOST:-localhost}${GRAFANA_SUBPATH:-/}}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GRAFANA_SERVE_FROM_SUB_PATH:-false}
      - INTERNAL_IP_CIDRS=${INTERNAL_IP_CIDRS:-}
    networks:
      - proxy_net
    ports:
      - target: 3000
        published: 3000
        mode: host
    volumes:
      - ./logging/data/grafana:/var/lib/grafana
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./logging/grafana/dashboards:/var/lib/grafana/dashboards-src:ro
      - ./logging/:/etc/logging-config/:ro
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.traefik == true
      labels:
        - "traefik.enable=${GRAFANA_TRAEFIK_ENABLE:-true}"
        - "traefik.swarm.network=traefik_proxy_net"
        - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST:-localhost}`) && PathPrefix(`${GRAFANA_SUBPATH:-/}`)"
        - "traefik.http.routers.grafana.priority=500"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls=true"
        - "traefik.http.routers.grafana.tls.certresolver=le"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        # Redirect HTTP -> HTTPS for Grafana
        - "traefik.http.middlewares.grafana-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.grafana-http.rule=Host(`${GRAFANA_HOST:-localhost}`) && PathPrefix(`${GRAFANA_SUBPATH:-/}`)"
        - "traefik.http.routers.grafana-http.priority=500"
        - "traefik.http.routers.grafana-http.entrypoints=web"
        - "traefik.http.routers.grafana-http.middlewares=grafana-https-redirect@swarm"

