services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.15.0-victorialogs
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=100y
      - -httpListenAddr=:9428
    networks:
      - proxy_net
    # Port 9428 is kept internal to proxy_net so VictoriaLogs is never exposed
    # on public interfaces. Access VMUI via SSH tunnel or docker exec if needed.
    volumes:
      - ./logging/data/victorialogs:/victoria-logs-data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.traefik == true

  vector:
    image: timberio/vector:0.42.0-alpine
    command:
      - --config
      - /etc/vector/vector.yaml
    networks:
      - proxy_net
    volumes:
      - ./ACCESS_LOGS/:/var/log/ACCESS_LOGS/:ro
      - ./logging/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ./logging/data/vector:/var/lib/vector
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.traefik == true

  grafana:
    image: grafana/grafana:11.5.2
    user: "0:0"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?ERROR_Set_GRAFANA_ADMIN_PASSWORD_in_config.bash}
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000/stats/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GRAFANA_SERVE_FROM_SUB_PATH:-true}
    networks:
      - proxy_net
    ports:
      - target: 3000
        published: 3000
        mode: host
    volumes:
      - ./logging/data/grafana:/var/lib/grafana
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./logging/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.traefik == true
      labels:
        # Uncomment below and set GRAFANA_HOST / GRAFANA_SUBPATH in config.bash
        # to expose ONLY Grafana Public Dashboards at https://<host>/stats via Traefik HTTPS
        # (keeping /stats/login and admin APIs off the public internet):
        # - "traefik.enable=true"
        # - "traefik.swarm.network=traefik_proxy_net"
        # - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOST:-example.org}`) && (PathPrefix(`${GRAFANA_SUBPATH:-/stats}/public-dashboards`) || PathPrefix(`${GRAFANA_SUBPATH:-/stats}/api/public`) || PathPrefix(`${GRAFANA_SUBPATH:-/stats}/public/`))"
        # - "traefik.http.routers.grafana.priority=500"
        # - "traefik.http.routers.grafana.entrypoints=websecure"
        # - "traefik.http.routers.grafana.tls=true"
        # - "traefik.http.routers.grafana.tls.certresolver=le"
        # - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        - "traefik.enable=false"
